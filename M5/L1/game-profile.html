<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game profile HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>My game profile</h1>
    <p id="name">Name:</p>
    <p id="score">Score:</p>
    <p id="top_score">Top score:</p>
    <p id="greeting">Greeting:</p>
    <p id="bonus_level">Bonus level:</p>
    <p id="team_name">Team Name:</p>
    <button type="button" class="btn btn-danger" onclick=" show_profile()">Show profile</button>
    <script>
        function show_greeting(){
            let hour=new Date().getHours()
            if(hour<12){
                return "good morning"
            
            }
            else if(hour<17){
                return "good afternoon"
            }
            else if(hour<20){
                return"good evening"
            }
            else {
                return "goodnight"
            }
            
        }
        function show_profile() {
            document.getElementById("name").innerText = "name: Alex"
            document.getElementById("score").innerText = "score: 75 out of 100"
            document.getElementById("top_score").innerText = "top score: false"
            document.getElementById("greeting").innerText = "greeting:"+show_greeting()
            document.getElementById("bonus_level").innerText = "bonus level: zombie"
            document.getElementById("team_name").innerText = "team name: gamers"
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
