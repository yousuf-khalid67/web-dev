<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lucky draw HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Lucky Draw</h1>
    <h4>Enter your name and guess a number to win!</h4>
    <input type="text" id="username" placeholder="Your Name">
    <input type="number" name="guess" id="guess" min="1" max="5" placeholder="Guess a number [1-5]">
    <button type="button" class="btn btn-dark">Try your luck</button>
    <p id="output"></p>

    <script>
        var username = document.getElementById("username").value
        var guess = document.getElementById("guess").value
        var ans=Math.floor(Math.random()*5)+1
        if(guess==ans){
            document.getElementById("output").innerHTML="good job u answerd correctly👍"
        }
        else{
               document.getElementById("output").innerHTML = "u failed do it agian😡😡😡😡😡😡😡"
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
