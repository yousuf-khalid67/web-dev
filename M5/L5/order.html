<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My delivery tracker HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Order HTML</h1>
    <button type="button" class="btn btn-dark" onclick="save_order()">Save Order</button>
    <button type="button" class="btn btn-dark" onclick="delivery()">Start Delivery</button>
    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>

    <script>
        var order = {
            item: "mango",
            price: "$2",
            shop: "super market"
        }
        function save_order() {
            var json_text = JSON.stringify(order)
            document.getElementById("p1").innerHTML = json_text

        }
        async function delivery() {
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            document.getElementById("p2").innerHTML = "order is received"
            await sleep(3000)
            document.getElementById("p2").innerHTML = "kitchen is preping"
            await sleep(3000)
            document.getElementById("p2").innerHTML = "out for delivery"
            await sleep(3000)
            document.getElementById("p3").innerHTML = "your order has arrived"
        }

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
