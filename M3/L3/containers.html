<!doctype html>
<html lang="en">

<head>
    <meta="utf-8">
        <meta charsetname="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>



<body>
    <h1>containers in HTML</h1>

    <div class="container-fluid p-3 mb-2 bg-primary text-white">
        <h2>My Hobby Hub</h2>
        <p>Apage about the things i love to do</p>

    </div>

    <div class="container-md p-3 mb-2 bg-success text-white">
        <h2>Reading</h2>
        <p>I love reading adventure</p>
    </div>

    <div class="container-md p-3 mb-2 bg-warning text-dark">
        <h2>Drawing</h2>
        <p>i like Drawing</p>
    </div>

    <div class="container-md p-3 mb-2 bg-info text-dark">
        <h2>coding</h2>
        <p>i like coding games</p>
    </div>

    <div class="container-md p-3 mb-2 bg-danger text-white">
        <h2>sports</h2>
        <p>i hate sports</p>
    </div>

    <div class="container-md p-3 mb-2 bg-white text-dark">
        <h2>music</h2>
        <p>music is okay</p>
    </div>

    <div class="container-fluid p-3 mb-2 bg-dark text-white">
        <p>Made with Bootstrap-My Hobby Hub</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
