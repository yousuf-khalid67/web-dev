<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and lists in HTML</title>
</head>
<body>
    <h1>Links and lists in HTML</h1>

    <h3>links in HTML</h3>

    <a href="https://ronsterrides.com/">Vist Ronsterrides NOW</a>

    <h5>An unordered HTML list</h5>
    <ul>
        <li>mango</li> 
        <li>orange</li>
        <li>Coconut</li>
        <li>banana</li>
        <li>dragon fruit</li>
        <li>apple</li>
    </ul>

    <h6>an ordered HTML list</h6>
    <ol>
        <li>MTB</li>
        <li>Dirt bike</li>
        <li>ebike</li>
        <li>emoto</li> 
        <li>supermoto</li>
        <li>BMX</li>
    </ol>
</body>
</html>
