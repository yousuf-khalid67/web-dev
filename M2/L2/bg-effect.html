<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background effect</title>
    <style>
        div {
            width: 300px;
            height: 200px;
            border: 2px solid black;
   }
   #bg-color{
    background-color: black;
   }
   #bg-linear{
    background: linear-gradient(purple, red);
   }
   #bg-img{
    background-image: url();
   }
    </style>
</head>

<body>
    <h2>background effect</h2>

    <div id="bg-color"></div>
    <div id="bg-linear"></div>
    <div id="bg-img"></div>

</body>

</html>
