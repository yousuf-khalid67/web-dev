<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <style>
        body {
            background-color: rgb(179, 104, 179);
            font-family: monospace;
            text-align: center;
        }

        h1 {
            color: rgb(0, 30, 31);
        }

        ul>li{
            list-style: none;
        }

        ul>li>div{
            padding: 20px 10px;
            border: 1px solid rgb(100, 16, 100);
            background-color: rgb(255, 148, 255);
            border-radius: 10px;
            margin: 10px;
        }
        ul>li>div:hover{
          background-color: rgb(100, 0, 100);  
          color: white;
          font-weight: bold;
          font-size: large;
          cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Food Menu</h1>
    <ul>
        <li>
            <div>shawarma</div>
        </li>
        <li>
            <div>pizza</div>
        </li>
        <li>
            <div>pasta</div>
        </li>
        <li>
            <div>nachos</div>
        </li>
        <li>
            <div>burger</div>
        </li>
    </ul>

</body>

</html>
