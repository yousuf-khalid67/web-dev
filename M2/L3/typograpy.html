<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography HTML</title>
    <style>
        body {
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        #thunder {
            color: rgba(255, 255, 0, 0.829);
            font-size: 3rem;
            text-shadow: 7px 2px rgba(255, 255, 0, 0.5);

        }

        #hero {
            color: aliceblue;

        }

        .power {
            color: brown;
            text-transform: uppercase;
        }

        .run {
            color: greenyellow;
        }

        .hw {
            color: aliceblue;
        }

        #top {
            color: yellowgreen;
            rotate: 35deg;
        }
    </style>
</head>

<body>
    <h1 id="thunder">Thunder Kid</h1>
    <p id="hero"><i>The Most Powerful Hero In The School</i></p>

    <h2 class="power"><u>Super Powers</u></h2>
    <p class="run"><b>Can run faster than a cheetah</b></p>
    <p class="run"><b>Cn lift a school bus</b></p>
    <h2 class="power"><u>Weakness</u></h2>
    <h2 class="hw"><del>Maths homework</del></h2>
    <h2 class="hw"><del>Broccoli</del></h2>
    <h2 id="top">Top Hero</h2>
</body>

</html>
