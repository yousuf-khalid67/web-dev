<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dom html</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>my zoo</h1>
    <p id="zone_1">zone 1:</p>
    <p id="zone_2">zone 2:</p>
    <p id="zone_3">zone 3:</p>
    <p id="total">Total animals:</p>
    <button type="button" class="btn btn-danger" onclick="zoo()">Open the zoo</button>
    <script>
        function zoo() {
            document.getElementById("zone_1").innerText = "zone 1: monkey"
            document.getElementById("zone_2").innerText = "zone 2: elephant"
            document.getElementById("zone_3").innerText = "zone 3: gorrila"
            document.getElementById("total").innerText = "Total animal: 3"
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
