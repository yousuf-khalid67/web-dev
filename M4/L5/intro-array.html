<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>intro to array</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>intro to array</h1>
    <button type="button" class="btn btn-light" onclick="add()">add</button>
    <button type="button" class="btn btn-dark" onclick="remove()">remove</button>
    <p id="output"></p>


    <script>
        var ebikes = ["Stark varg", "Ultra bee", "Light bee", "Yozma", "Rtr", "Altis sigma"]
        document.getElementById("output").innerHTML = ebikes
        function remove() {
            ebikes.pop()
            document.getElementById("output").innerHTML = ebikes
        }
        function add() {
            ebikes.push("razor")
            document.getElementById("output").innerHTML = ebikes
        }


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
