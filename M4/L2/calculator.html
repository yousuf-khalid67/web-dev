<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <h1>calculator</h1>
    <input type="number" name="num1" id="num1">
    <input type="number" name="num2" id="num2">

    <p id="input"></p>
    <button type="button" class="btn btn-primary" onclick="add()">add</button>
    <button type="button" class="btn btn-warning" onclick="subtract()">subtract</button>
    <button type="button" class="btn btn-info" onclick="divide()">divide</button>
    <button type="button" class="btn btn-danger" onclick="multiply()">multiply</button>
    <p id="output"></p>

    <script>






        function add() {
            var num1 = Number(document.getElementById("num1").value)
            var num2 = Number(document.getElementById("num2").value)


            document.getElementById("output").innerHTML = "sum=" + (num1 + num2)
        }
        function subtract() {
            var num1 = document.getElementById("num1").value
            var num2 = document.getElementById("num2").value

            document.getElementById("output").innerHTML = "subtraction=" + (num1 - num2)

        }
        function divide() {
            var num1 = document.getElementById("num1").value
            var num2 = document.getElementById("num2").value

            document.getElementById("output").innerHTML = "division=" + (num1 / num2)

        }
        function multiply() {
            var num1 = document.getElementById("num1").value
            var num2 = document.getElementById("num2").value

            document.getElementById("output").innerHTML = "multiplication=" + (num1 * num2)

        }


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
