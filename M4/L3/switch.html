<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch in java script</title>

</head>

<body>
    <h2>switch in java script</h2>
    <p id="output"></p>
    <script>
       var day
       switch(new Date().getDay()){
        case 0:
            day="sunday"
            break
       }
        document.getElementById("output").innerHTML = day
    </script>
</body>

</html>
