<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops in java script</title>

</head>

<body>
    <h2>loops in java script</h2>
    <p id="output"></p>
    <script>
        var fruits = ["mango", "banana", "dragon fruit", "apples"]
        var text = ""
        for (i = 0; i < fruits.length; i++) {
            text += fruits[i] + " "
        }
        document.getElementById("output").innerHTML = text
    </script>
</body>

</html>
