<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <!-- My CSS -->
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            margin: 0;
            font-family: "Baloo Tamma 2", sans-serif;
            background: #fff;
        }

        /* Full width navbar */
        .navigation {
            background: #222;
            border-top: 2px solid #222;
            padding: 12px 40px !important;
        }

        /* Logo */
        .brand-logo {
            height: 26px;
            width: auto;
        }

        /* Links */
        .navigation-link {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: #fff !important;
        }

        .navigation-link:hover {
            color: #f2a900 !important;
        }
    </style>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/996973c893.js"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
        rel="stylesheet" />

    <title>Portfolio</title>
</head>

<body>
    <div class="container-fluid navigation pt-3">
        <div class="row">
            <div class="col-6 d-flex justify-content-start align-items-center">
                <i class="fas fa-code fa-2x text-warning pb-3"></i>
                <h5 class="d-inline pl-2 text-white">YOUSUF</h5>
            </div>
            <div class="col-6 pt-2">
                <div class="row text-center p-0 d-flex justify-content-end align-items-center">
                    <div class="col-3">
                        <a href="#home" class="text-white navigation-link">Home</a>
                    </div>
                    <div class="col-3">
                        <a href="#about" class="text-white navigation-link">About</a>
                    </div>
                    <div class="col-3">
                        <a href="#projects" class="text-white navigation-link">Projects</a>
                    </div>
                    <div class="col-3">
                        <a href="#contact"
                            target="_blank" class="text-white navigation-link">Contact</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section id="home" class="d-flex flex-column gap-3 justify-content-center align-items-center py-5">
        <h1 class="display-2">Hi I am YOUSUF</h1>
        <h2>I build interactive web apps</h2>
        <div>
            <button type="button" class="btn btn-dark">View My Work</button>
            <button type="button" class="btn btn-outline-dark">Contact Me</button>
        </div>
    </section>

    <section id="about"></section>
    <section id="projects"></section>
    <section id="contact"></section>
    <section id="copyright"></section>

</body>

</html>
